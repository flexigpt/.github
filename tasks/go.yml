# https://taskfile.dev

# Generate sha256 as:
# curl -sSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml | shasum -a 256
#
# includes:
#   go:
#     taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml
#     checksum: <sha256>

version: "3"

vars:
  # Repository configuration.
  GREETING: '{{.GREETING | default "Hello, these are Go tasks!"}}'
  GO_REPO_DIR: '{{.GO_REPO_DIR | default "."}}'

  # `GO_MODULE_PATH` remains dynamic. A supplied Task variable overrides it;
  # otherwise it is resolved using `go list -m`.
  GO_MODULE_PATH:
    sh: go list -m

  # Dependency graph configuration.
  DEPGRAPH_ENTRY_POINT: '{{.DEPGRAPH_ENTRY_POINT | default .GO_MODULE_PATH}}'
  DEPGRAPH_OMIT_PACKAGES: '{{.DEPGRAPH_OMIT_PACKAGES | default (printf "%s,command-line-arguments" .GO_MODULE_PATH)}}'
  DEPGRAPH_OUTPUT_FILE: '{{.DEPGRAPH_OUTPUT_FILE | default "godepgraph.png"}}'

  # gopls configuration.
  # This path is relative to GO_REPO_DIR.
  GOPLS_INPUT_DIR: '{{.GOPLS_INPUT_DIR | default "."}}'
  GOPLS_JOBS: '{{.GOPLS_JOBS | default "8"}}'
  GOPLS_FILES_PER_JOB: '{{.GOPLS_FILES_PER_JOB | default "100"}}'

  # Lint configuration.
  SPECIFIC_LINTER: '{{.SPECIFIC_LINTER | default ""}}'

  # Test configuration.
  GO_TEST_COUNT: '{{.GO_TEST_COUNT | default "1"}}'
  GO_TEST_PACKAGE_PATTERN: '{{.GO_TEST_PACKAGE_PATTERN | default "./..."}}'
  GO_TEST_TAGS: '{{.GO_TEST_TAGS | default "integration"}}'

  # Coverage configuration.
  GO_COVERAGE_MODE: '{{.GO_COVERAGE_MODE | default "atomic"}}'
  GO_COVERAGE_PACKAGE_PATTERN: '{{.GO_COVERAGE_PACKAGE_PATTERN | default "./..."}}'
  GO_COVERAGE_PROFILE: '{{.GO_COVERAGE_PROFILE | default "coverage.out"}}'
  GO_COVERAGE_CONFIG_FILE: '{{.GO_COVERAGE_CONFIG_FILE | default ".testcoverage.yml"}}'
  GO_COVERAGE_BREAKDOWN_FILE: '{{.GO_COVERAGE_BREAKDOWN_FILE | default "file_breakdown.txt"}}'

  # Tool versions.
  GOPLS_VERSION: '{{.GOPLS_VERSION | default "v0.23.0"}}'
  GOLANGCI_LINT_VERSION: '{{.GOLANGCI_LINT_VERSION | default "v2.12.2"}}'
  GOMAJOR_VERSION: '{{.GOMAJOR_VERSION | default "v0.15.0"}}'
  GO_MOD_UPGRADE_VERSION: '{{.GO_MOD_UPGRADE_VERSION | default "v0.12.0"}}'
  GODEPGRAPH_VERSION: '{{.GODEPGRAPH_VERSION | default "v1.0.0"}}'
  REFDIR_VERSION: '{{.REFDIR_VERSION | default "v0.7.1"}}'
  GO_TEST_COVERAGE_VERSION: '{{.GO_TEST_COVERAGE_VERSION | default "v2.19.0"}}'

tasks:
  default:
    desc: Show the base Go task greeting
    cmds:
      - echo {{.GREETING | shellQuote}}
      - task --list-all
    silent: true

  install-tools:
    desc: Install pinned Go development tools
    cmds:
      # Install Go, Task, and Graphviz externally.
      # Graphviz provides the `dot` command used by `depgraph`.
      - go install golang.org/x/tools/gopls@{{.GOPLS_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/icholy/gomajor@{{.GOMAJOR_VERSION}}
      - go install github.com/oligot/go-mod-upgrade@{{.GO_MOD_UPGRADE_VERSION}}
      - go install github.com/kisielk/godepgraph@{{.GODEPGRAPH_VERSION}}
      - go install github.com/ppipada/refdir@{{.REFDIR_VERSION}}
      - go install github.com/vladopajic/go-test-coverage/v2@{{.GO_TEST_COVERAGE_VERSION}}

  depgraph:
    desc: Generate a Go dependency graph
    dir: "{{.GO_REPO_DIR}}"
    set:
      - pipefail
    cmds:
      - >-
        godepgraph
        -s
        -o {{.DEPGRAPH_OMIT_PACKAGES | shellQuote}}
        {{.DEPGRAPH_ENTRY_POINT | shellQuote}}
        |
        dot
        -Tpng
        -o {{.DEPGRAPH_OUTPUT_FILE | shellQuote}}

  upgrade-do:
    desc: Upgrade dependencies and tidy the module
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - go-mod-upgrade -v -f
      - go mod tidy

  upgrade-check:
    desc: Check for available dependency upgrades
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - gomajor list
      - go-mod-upgrade -l

  lint-sort:
    desc: Run refdir checks
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - refdir ./...

  lint-gopls:
    desc: Run gopls checks for Go files in the selected directory
    dir: "{{.GO_REPO_DIR}}"
    set:
      - pipefail
    cmds:
      - |
        input_dir={{.GOPLS_INPUT_DIR | shellQuote}}
        jobs={{.GOPLS_JOBS | shellQuote}}
        files_per_job={{.GOPLS_FILES_PER_JOB | shellQuote}}
        file_list="$(mktemp "${TMPDIR:-/tmp}/gopls-files.XXXXXX")"

        trap 'rm -f "$file_list"' EXIT

        find "$input_dir" \
          -type d -name vendor -prune -o \
          -type f -name '*.go' -print0 > "$file_list"

        if [ ! -s "$file_list" ]; then
          echo "gopls: no Go files found in $input_dir"
          exit 0
        fi

        total="$(tr -cd '\000' < "$file_list" | wc -c | tr -d '[:space:]')"
        batches=$(( (total + files_per_job - 1) / files_per_job ))

        printf 'gopls: checking %s file(s) in up to %s batch(es), with %s concurrent job(s)\n' \
          "$total" "$batches" "$jobs"

        xargs -0 \
          -n "$files_per_job" \
          -P "$jobs" \
          sh -c '
            printf "gopls: checking batch containing %s file(s)\n" "$#"
            exec gopls check -- "$@"
          ' sh < "$file_list"

  lint-fix-specific:
    desc: Apply fixes from one golangci-lint linter
    dir: "{{.GO_REPO_DIR}}"
    requires:
      vars:
        - SPECIFIC_LINTER
    cmds:
      - >-
        golangci-lint run
        --fix
        --enable-only {{.SPECIFIC_LINTER | shellQuote}}
        ./...

  lint:
    desc: Run golangci-lint
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - golangci-lint run -v ./...

  test:
    desc: Run Go tests and create a coverage profile
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - >-
        go test
        -count={{.GO_TEST_COUNT | shellQuote}}
        -tags={{.GO_TEST_TAGS | shellQuote}}
        -covermode={{.GO_COVERAGE_MODE | shellQuote}}
        -coverpkg={{.GO_COVERAGE_PACKAGE_PATTERN | shellQuote}}
        -coverprofile={{.GO_COVERAGE_PROFILE | shellQuote}}
        {{.GO_TEST_PACKAGE_PATTERN | shellQuote}}

  coverage-analysis:
    desc: Print coverage analysis from the coverage profile
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - go tool cover -func={{.GO_COVERAGE_PROFILE | shellQuote}}

  coverage-check:
    desc: Validate coverage against the repository policy
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - >-
        go-test-coverage
        --config={{.GO_COVERAGE_CONFIG_FILE | shellQuote}}
        --breakdown-file-name={{.GO_COVERAGE_BREAKDOWN_FILE | shellQuote}}

  coverage:
    desc: Generate, analyze, and validate coverage
    cmds:
      - task: test
      - task: coverage-analysis
      - task: coverage-check

  lt:
    desc: Run lint and complete coverage validation
    cmds:
      - task: lint
      - task: coverage