# https://taskfile.dev

# Generate sha256 as: curl -sSL https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml | shasum -a 256
#
# includes:
#   go:
#     taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml
#     checksum: <sha256>

version: "3"

vars:
  # Repository configuration.
  GREETING: Hello, these are base Go tasks!
  GO_REPO_DIR: "."

  # `go list -m` returns the current module path, for example:
  # github.com/flexigpt/llmtools-go
  GO_MODULE_PATH:
    sh: go list -m

  # Dependency graph configuration.
  # By default, graph the package at the module root.
  DEPGRAPH_ENTRY_POINT: "{{.GO_MODULE_PATH}}"
  DEPGRAPH_OMIT_PACKAGES: "{{.GO_MODULE_PATH}},command-line-arguments"
  DEPGRAPH_OUTPUT_FILE: godepgraph.png

  # Lint configuration.
  SPECIFIC_LINTER: ''

  # Test configuration.
  GO_TEST_COUNT: "1"
  GO_TEST_PACKAGE_PATTERN: ./...
  GO_TEST_TAGS: "integration"

  # Coverage configuration.
  GO_COVERAGE_MODE: atomic
  GO_COVERAGE_PACKAGE_PATTERN: ./...
  GO_COVERAGE_PROFILE: coverage.out
  GO_COVERAGE_CONFIG_FILE: .testcoverage.yml
  GO_COVERAGE_BREAKDOWN_FILE: file_breakdown.txt

  # Tool versions.
  GOPLS_VERSION: v0.23.0
  GOLANGCI_LINT_VERSION: v2.12.2
  GOMAJOR_VERSION: v0.15.0
  GO_MOD_UPGRADE_VERSION: v0.12.0
  GODEPGRAPH_VERSION: v1.0.0
  REFDIR_VERSION: v0.7.1
  GO_TEST_COVERAGE_VERSION: v2.19.0

tasks:
  default:
    desc: Show the base Go task greeting
    cmds:
      - echo {{.GREETING | shellQuote}}
    silent: true

  install-tools:
    desc: Install pinned Go development tools
    cmds:
      # Install Go, Task, and Graphviz externally.
      # Graphviz provides the `dot` command used by `depgraph`.
      - go install golang.org/x/tools/gopls@{{.GOPLS_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/icholy/gomajor@{{.GOMAJOR_VERSION}}
      - go install github.com/oligot/go-mod-upgrade@{{.GO_MOD_UPGRADE_VERSION}}
      - go install github.com/kisielk/godepgraph@{{.GODEPGRAPH_VERSION}}
      - go install github.com/ppipada/refdir@{{.REFDIR_VERSION}}
      - go install github.com/vladopajic/go-test-coverage/v2@{{.GO_TEST_COVERAGE_VERSION}}

  depgraph:
    desc: Generate a Go dependency graph
    aliases:
      - godepgraph
    dir: "{{.GO_REPO_DIR}}"
    set:
      - pipefail
    cmds:
      - >-
        godepgraph
        -s
        -o {{.DEPGRAPH_OMIT_PACKAGES | shellQuote}}
        {{.DEPGRAPH_ENTRY_POINT | shellQuote}}
        |
        dot
        -Tpng
        -o {{.DEPGRAPH_OUTPUT_FILE | shellQuote}}

  upgrade-do:
    desc: Upgrade dependencies and tidy the module
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - go-mod-upgrade -v -f
      - go mod tidy

  upgrade-check:
    desc: Check for available dependency upgrades
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - gomajor list
      - go-mod-upgrade -l

  lint-gosort:
    desc: Run refdir checks
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - refdir ./...

  lint-gopls:
    desc: Run gopls checks for all repository Go files
    dir: "{{.GO_REPO_DIR}}"
    vars:
      GO_FILES:
        sh: find . -type f -name '*.go' -not -path './vendor/*'
    cmds:
      - for:
          var: GO_FILES
          split: "\n"
        task: lint-gopls-file
        vars:
          GO_FILE: "{{.ITEM}}"
        parallel: true

  lint-gopls-file:
    internal: true
    dir: "{{.GO_REPO_DIR}}"
    requires:
      vars:
        - GO_FILE
    cmds:
      - gopls check -- {{.GO_FILE | shellQuote}}

  lint-fix-specific:
    desc: Apply fixes from one golangci-lint linter
    dir: "{{.GO_REPO_DIR}}"
    requires:
      vars:
        - SPECIFIC_LINTER
    cmds:
      - >-
        golangci-lint run
        --fix
        --enable-only {{.SPECIFIC_LINTER | shellQuote}}
        ./...

  lint:
    desc: Run golangci-lint
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - golangci-lint run -v ./...

  test:
    desc: Run Go tests
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - >-
        go test
        -count={{.GO_TEST_COUNT | shellQuote}}
        -tags={{.GO_TEST_TAGS | shellQuote}}
        {{.GO_TEST_PACKAGE_PATTERN | shellQuote}}

  test-coverage:
    desc: Run Go tests and create a coverage profile
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - >-
        go test
        -count={{.GO_TEST_COUNT | shellQuote}}
        -tags={{.GO_TEST_TAGS | shellQuote}}
        -covermode={{.GO_COVERAGE_MODE | shellQuote}}
        -coverpkg={{.GO_COVERAGE_PACKAGE_PATTERN | shellQuote}}
        -coverprofile={{.GO_COVERAGE_PROFILE | shellQuote}}
        {{.GO_TEST_PACKAGE_PATTERN | shellQuote}}

  coverage-analysis:
    desc: Print coverage analysis from the coverage profile
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - go tool cover -func={{.GO_COVERAGE_PROFILE | shellQuote}}

  coverage-check:
    desc: Validate coverage against the repository policy
    aliases:
      - coverage-test
    dir: "{{.GO_REPO_DIR}}"
    cmds:
      - >-
        go-test-coverage
        --config={{.GO_COVERAGE_CONFIG_FILE | shellQuote}}
        --breakdown-file-name={{.GO_COVERAGE_BREAKDOWN_FILE | shellQuote}}

  coverage:
    desc: Generate, analyze, and validate coverage
    cmds:
      - task: test-coverage
      - task: coverage-analysis
      - task: coverage-check

  lt:
    desc: Run lint and complete coverage validation
    cmds:
      - task: lint
      - task: coverage